; Kitchen scale firmware (PlatformIO). How to build and flash from the Mac:
; docs/kitchen-scale/README.md → "Flashing from the Mac".
; Every platform and library version is pinned, so a build never changes by itself.
;
; Programs (environments):
;   display           the Guition ESP32-4848S040 touchscreen board (stage 0 board check)
;   bench             stage 1: HX711 + load cell on the separate ESP32-S3 dev board, logs on its UART/COM USB port
;   bench_native_usb  the same, for a dev board that only has the chip's own USB port

[platformio]
default_envs = display

; Both boards carry an ESP32-S3 N16R8 module (16 MB flash, 8 MB octal PSRAM).
; Platform: pioarduino, the community-maintained platform that brings Arduino core 3.x
; to PlatformIO (PlatformIO's own espressif32 still ships core 2.0.17, which the
; screen library no longer supports). 55.03.312 = Arduino core 3.3.12.
[esp32s3_n16r8]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
framework = arduino
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
; Our own files (src/) must build without warnings; libraries keep their defaults.
; The framework's flags exempt some warnings from -Werror; the -Werror= list takes them back.
build_src_flags =
    -Wall -Wextra -Werror
    -Werror=unused-variable -Werror=unused-but-set-variable -Werror=unused-function
    -Werror=uninitialized -Werror=maybe-uninitialized -Werror=extra

[env:display]
extends = esp32s3_n16r8
build_src_filter = +<*> -<bench/>
build_flags =
    -DBOARD_HAS_PSRAM
    -DFIRMWARE_VERSION=\"0.1.0\"
lib_deps =
    moononournation/GFX Library for Arduino@1.6.8

[env:bench]
extends = esp32s3_n16r8
build_src_filter = +<bench/>
build_flags =
    -DBOARD_HAS_PSRAM
    -DFIRMWARE_VERSION=\"0.2.0\"

[env:bench_native_usb]
extends = env:bench
build_flags =
    ${env:bench.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=1
