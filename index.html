<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Stamps the .dark class on <html> before first paint, reading the
      // same persisted value useThemeStore will read once React mounts —
      // otherwise the page would flash the light theme for a frame (or
      // vice versa) on every load, since the store's own effect can't run
      // until after the initial render.
      (function () {
        try {
          var raw = localStorage.getItem('theme-preference')
          var theme = raw ? JSON.parse(raw).state.theme : 'system'
          var dark = theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) document.documentElement.classList.add('dark')
        } catch (e) {}
      })()
    </script>
    <link rel="icon" type="image/svg+xml" href="/Project_Daily/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- theme-color tints the browser/PWA chrome (Android status bar, Safari
         tab bar) — matched to the header surface (cream-50) per scheme; the
         old #ef4444 red predated the amber/cream design entirely. -->
    <meta name="theme-color" content="#FEFCF9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#201D17" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- black-translucent: the installed PWA draws edge-to-edge under the iOS
         status bar (clock/battery float over the app's own header background
         — the native-app look). The header adds pt-[env(safe-area-inset-top)]
         so its content never sits under the status bar text (layout.tsx). -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Board" />
    <link rel="apple-touch-icon" href="/Project_Daily/favicon.svg" />
    <title>Lasci's Board</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
