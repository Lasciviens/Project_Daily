# Supabase project config — consumed by `supabase functions deploy` in CI
# (.github/workflows/deploy-functions.yml) so per-function settings apply
# automatically on every merge, instead of hand-deploying each function.
#
# CRITICAL: the two webhook receivers authenticate with their OWN Bearer secret
# (HEVY_WEBHOOK_SECRET / HEALTH_EXPORT_WEBHOOK_SECRET), NOT a Supabase JWT. If
# platform JWT verification is left ON for them, Supabase rejects every Hevy /
# Health Auto Export call before our code runs. verify_jwt = false keeps them
# reachable (this is the deploy gotcha long documented in CLAUDE.md, now
# enforced declaratively so a redeploy can't silently re-break it).
project_id = "hsaedwwqpcjizeozjbch"

[functions.hevy-sync]
verify_jwt = false

[functions.health-export-webhook]
verify_jwt = false

# Dual-auth: user JWT ("Fetch now") OR x-sync-secret (cron) — the secret path
# is not a Supabase JWT, so platform verification must be off (checked in-code).
[functions.google-health-sync]
verify_jwt = false

# Dual-auth: browser user JWT (validated in-code by getUser) OR the iPhone
# device secret (x-phone-secret === PHONE_GATEWAY_SECRET → acts as the single
# user). The secret path is not a Supabase JWT, so platform verification is off
# and auth is enforced in-code. The browser flow is unchanged (getUser still
# validates its JWT).
[functions.ai-proxy]
verify_jwt = false

# The iPhone's single durable entry point — authenticates by x-phone-secret
# (device secret), acts as the single user via the service role, server-side.
[functions.phone-gateway]
verify_jwt = false
