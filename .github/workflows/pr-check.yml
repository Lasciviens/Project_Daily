# PR gate. deploy.yml only runs on push to main, so without this a broken build
# is first discovered AFTER merge, by the deploy going red.
#
# Deliberately a separate workflow: adding a pull_request trigger to deploy.yml
# would try to publish a Pages deployment per PR.
name: PR check

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Unlike the Pages deploy, cancelling a type-check has no side effects, so a new
# push to the same branch supersedes the previous run.
concurrency:
  group: pr-check-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  typecheck-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # A throwaway Postgres for the deploy runner's end-to-end checks below
    # (transactions, lock retries, what the public log shows).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Same command the deploy job runs: tsc -b && vite build.
      # No VITE_* secrets on purpose — Vite never executes app code at build
      # time, so a missing env var cannot fail this. This job proves the code
      # COMPILES and BUNDLES; the deploy job is what needs real values.
      - name: Type-check and build
        run: npm run build

      # Pure-function regression suite for the Training -> Progress exercise
      # progress engine (src/features/training/progress-engine/) — this repo
      # has no unit-test runner by convention (see AGENTS.md), so these run
      # directly via sucrase against the real, un-mocked modules. Previously
      # only ever run locally by hand; a broken engine change could merge
      # with a green PR-check. Add further scripts/verify-*.cjs suites here
      # as they're written.
      - name: Progress engine regression suite
        run: node scripts/verify-progress-engine.cjs

      - name: Progress decisions regression suite
        run: node scripts/verify-progress-decisions.cjs

      # deploy.yml runs every migration numbered above 140 on merge. A new file
      # numbered 140 or lower, or two new files with one number, would never
      # run or would collide — caught here, before the merge.
      - name: Migration names and deploy rules
        run: |
          node scripts/deploy/run-migrations.mjs --check
          node scripts/verify-deploy-migrations.mjs
        env:
          DEPLOY_TEST_DB_URL: postgresql://postgres:postgres@localhost:5432/postgres

      # Migration 142's triggers (training task ⇄ block, skip ⇄ cancel, weekly
      # days) on a throwaway database: migrations 141 + 142 and their scenarios.
      - name: Training session database scenarios
        run: node scripts/verify-db-training-session.mjs
        env:
          DEPLOY_TEST_DB_URL: postgresql://postgres:postgres@localhost:5432/postgres

      # Migration 143's trigger (a closed task leaves Work's focus).
      - name: Task focus database scenarios
        run: node scripts/verify-db-task-focus.mjs
        env:
          DEPLOY_TEST_DB_URL: postgresql://postgres:postgres@localhost:5432/postgres

      # Migration 144's delete with Undo (cascades, links, rules, RLS, limits).
      - name: Delete and Undo database scenarios
        run: node scripts/verify-db-delete-undo.mjs
        env:
          DEPLOY_TEST_DB_URL: postgresql://postgres:postgres@localhost:5432/postgres

      # Migration 145's Google Tasks pull fixes (duplicate list names, the
      # upsert's links/tombstones/pending rows, the parent pass, grants).
      - name: Google Tasks pull database scenarios
        run: node scripts/verify-db-google-tasks-pull.mjs
        env:
          DEPLOY_TEST_DB_URL: postgresql://postgres:postgres@localhost:5432/postgres

      # Migration 146's repeat kinds on schedule_blocks (old rows stay weekly;
      # the CHECK keeps each kind's columns consistent).
      - name: Schedule repeat database scenarios
        run: node scripts/verify-db-schedule-repeat.mjs
        env:
          DEPLOY_TEST_DB_URL: postgresql://postgres:postgres@localhost:5432/postgres

      # Migration 147's repeating-plan Calendar link (the columns, and a
      # deleted plan's event queued in the calendar outbox like a block's).
      - name: Calendar series database scenarios
        run: node scripts/verify-db-calendar-series.mjs
        env:
          DEPLOY_TEST_DB_URL: postgresql://postgres:postgres@localhost:5432/postgres

      # Migration 148: an undated Google task is filed under Today (145's
      # scenarios re-run against the new upsert), and a repeating plan's
      # Google Calendar start day (schedule_blocks.google_calendar_from).
      - name: Google Today and series start database scenarios
        run: node scripts/verify-db-google-today-series.mjs
        env:
          DEPLOY_TEST_DB_URL: postgresql://postgres:postgres@localhost:5432/postgres

      # Migrations 150/151's "Undo this save" (plan, conflicts, confirm, one
      # transaction, undo of the undo, blocked changes, row level security;
      # outside services, side effects, a save racing the undo via dblink,
      # and the undo of watch changes on a second database with 149).
      - name: Undo a save database scenarios
        run: node scripts/verify-db-undo-save.mjs
        env:
          DEPLOY_TEST_DB_URL: postgresql://postgres:postgres@localhost:5432/postgres

      # Migration 149's watches (one row per watch, the cache columns that
      # follow them, old writers translated, the per-play Trakt outbox, Undo,
      # rewatch rounds).
      - name: Media watches database scenarios
        run: node scripts/verify-db-media-watches.mjs
        env:
          DEPLOY_TEST_DB_URL: postgresql://postgres:postgres@localhost:5432/postgres

      # Migration 152's Quick guess presets (the table rules, the seed for the
      # allowed accounts, row level security, the owner lock, the delete with
      # Undo).
      - name: Quick guess presets database scenarios
        run: node scripts/verify-db-quick-guess-items.mjs
        env:
          DEPLOY_TEST_DB_URL: postgresql://postgres:postgres@localhost:5432/postgres

      # Migration 153's carb and fat goals (the columns on the goal row and on
      # each phase's saved targets, old rows untouched, the range guard, row
      # level security, the activity log).
      - name: Carb and fat goals database scenarios
        run: node scripts/verify-db-day-targets-macros.mjs
        env:
          DEPLOY_TEST_DB_URL: postgresql://postgres:postgres@localhost:5432/postgres

      # Migration 154's Hevy additions (the exercise picture column and its URL
      # check, hevy_account: read-only for the app, written by the service
      # role, row level security, the owner lock, synced templates untouched).
      - name: Hevy full API database scenarios
        run: node scripts/verify-db-hevy-full-api.mjs
        env:
          DEPLOY_TEST_DB_URL: postgresql://postgres:postgres@localhost:5432/postgres

      # `npm run lint` is deliberately NOT a gate yet: it is red today, and a
      # large share of the errors come from eslint linting supabase/functions
      # (Deno code checked with browser globals). Narrow the ESLint scope and
      # clear the real src/ findings first, then promote it to a step here.

  # Every scripts/verify-*.cjs|mjs, several at a time, as its own job beside
  # the build above, so it adds no waiting time unless it is slower than the
  # build (measured 21–24 s against ~80 s). The step summary lists each
  # script's result and time.
  all-verify:
    name: All verify scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          # verify-api-registry compares dates with the git history.
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run every verify script
        run: node scripts/run-all-verify.mjs

