# PR gate. deploy.yml only runs on push to main, so without this a broken build
# is first discovered AFTER merge, by the deploy going red.
#
# Deliberately a separate workflow: adding a pull_request trigger to deploy.yml
# would try to publish a Pages deployment per PR.
name: PR check

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Unlike the Pages deploy, cancelling a type-check has no side effects, so a new
# push to the same branch supersedes the previous run.
concurrency:
  group: pr-check-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  typecheck-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # A throwaway Postgres for the deploy runner's end-to-end checks below
    # (transactions, lock retries, what the public log shows).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Same command the deploy job runs: tsc -b && vite build.
      # No VITE_* secrets on purpose — Vite never executes app code at build
      # time, so a missing env var cannot fail this. This job proves the code
      # COMPILES and BUNDLES; the deploy job is what needs real values.
      - name: Type-check and build
        run: npm run build

      # Pure-function regression suite for the Training -> Progress exercise
      # progress engine (src/features/training/progress-engine/) — this repo
      # has no unit-test runner by convention (see AGENTS.md), so these run
      # directly via sucrase against the real, un-mocked modules. Previously
      # only ever run locally by hand; a broken engine change could merge
      # with a green PR-check. Add further scripts/verify-*.cjs suites here
      # as they're written.
      - name: Progress engine regression suite
        run: node scripts/verify-progress-engine.cjs

      - name: Progress decisions regression suite
        run: node scripts/verify-progress-decisions.cjs

      # deploy.yml runs every migration numbered above 140 on merge. A new file
      # numbered 140 or lower, or two new files with one number, would never
      # run or would collide — caught here, before the merge.
      - name: Migration names and deploy rules
        run: |
          node scripts/deploy/run-migrations.mjs --check
          node scripts/verify-deploy-migrations.mjs
        env:
          DEPLOY_TEST_DB_URL: postgresql://postgres:postgres@localhost:5432/postgres

      # Migration 142's triggers (training task ⇄ block, skip ⇄ cancel, weekly
      # days) on a throwaway database: migrations 141 + 142 and their scenarios.
      - name: Training session database scenarios
        run: node scripts/verify-db-training-session.mjs
        env:
          DEPLOY_TEST_DB_URL: postgresql://postgres:postgres@localhost:5432/postgres

      # Migration 143's trigger (a closed task leaves Work's focus).
      - name: Task focus database scenarios
        run: node scripts/verify-db-task-focus.mjs
        env:
          DEPLOY_TEST_DB_URL: postgresql://postgres:postgres@localhost:5432/postgres

      # Migration 144's delete with Undo (cascades, links, rules, RLS, limits).
      - name: Delete and Undo database scenarios
        run: node scripts/verify-db-delete-undo.mjs
        env:
          DEPLOY_TEST_DB_URL: postgresql://postgres:postgres@localhost:5432/postgres

      # Migration 145's Google Tasks pull fixes (duplicate list names, the
      # upsert's links/tombstones/pending rows, the parent pass, grants).
      - name: Google Tasks pull database scenarios
        run: node scripts/verify-db-google-tasks-pull.mjs
        env:
          DEPLOY_TEST_DB_URL: postgresql://postgres:postgres@localhost:5432/postgres

      # Migration 146's repeat kinds on schedule_blocks (old rows stay weekly;
      # the CHECK keeps each kind's columns consistent).
      - name: Schedule repeat database scenarios
        run: node scripts/verify-db-schedule-repeat.mjs
        env:
          DEPLOY_TEST_DB_URL: postgresql://postgres:postgres@localhost:5432/postgres

      # Migration 147's repeating-plan Calendar link (the columns, and a
      # deleted plan's event queued in the calendar outbox like a block's).
      - name: Calendar series database scenarios
        run: node scripts/verify-db-calendar-series.mjs
        env:
          DEPLOY_TEST_DB_URL: postgresql://postgres:postgres@localhost:5432/postgres

      # Migration 148: an undated Google task is filed under Today (145's
      # scenarios re-run against the new upsert), and a repeating plan's
      # Google Calendar start day (schedule_blocks.google_calendar_from).
      - name: Google Today and series start database scenarios
        run: node scripts/verify-db-google-today-series.mjs
        env:
          DEPLOY_TEST_DB_URL: postgresql://postgres:postgres@localhost:5432/postgres

      # Migrations 150/151's "Undo this save" (plan, conflicts, confirm, one
      # transaction, undo of the undo, blocked changes, row level security;
      # outside services, side effects, a save racing the undo via dblink,
      # and the undo of watch changes on a second database with 149).
      - name: Undo a save database scenarios
        run: node scripts/verify-db-undo-save.mjs
        env:
          DEPLOY_TEST_DB_URL: postgresql://postgres:postgres@localhost:5432/postgres

      # Migration 149's watches (one row per watch, the cache columns that
      # follow them, old writers translated, the per-play Trakt outbox, Undo,
      # rewatch rounds).
      - name: Media watches database scenarios
        run: node scripts/verify-db-media-watches.mjs
        env:
          DEPLOY_TEST_DB_URL: postgresql://postgres:postgres@localhost:5432/postgres

      # Migration 161: Watching = rewatching (Completed → Watching starts the
      # round; Start rewatch picks up a pass under way; a new season, the Trakt
      # sync and a show without TMDB data start none; 149's checks on top).
      - name: Rewatch start database scenarios
        run: node scripts/verify-db-rewatch-start.mjs
        env:
          DEPLOY_TEST_DB_URL: postgresql://postgres:postgres@localhost:5432/postgres

      # Migration 152's Quick guess presets (the table rules, the seed for the
      # allowed accounts, row level security, the owner lock, the delete with
      # Undo).
      - name: Quick guess presets database scenarios
        run: node scripts/verify-db-quick-guess-items.mjs
        env:
          DEPLOY_TEST_DB_URL: postgresql://postgres:postgres@localhost:5432/postgres

      # Migration 159's Quick guess options (the column on rows that existed,
      # the shape check every writer meets — groups, picks, choices, limits —,
      # the activity log, the delete with Undo keeping them).
      - name: Quick guess options database scenarios
        run: node scripts/verify-db-quick-guess-options.mjs
        env:
          DEPLOY_TEST_DB_URL: postgresql://postgres:postgres@localhost:5432/postgres

      # Migration 153's carb and fat goals (the columns on the goal row and on
      # each phase's saved targets, old rows untouched, the range guard, row
      # level security, the activity log).
      - name: Carb and fat goals database scenarios
        run: node scripts/verify-db-day-targets-macros.mjs
        env:
          DEPLOY_TEST_DB_URL: postgresql://postgres:postgres@localhost:5432/postgres

      # Migration 154's Hevy additions (the exercise picture column and its URL
      # check, hevy_account: read-only for the app, written by the service
      # role, row level security, the owner lock, synced templates untouched).
      - name: Hevy full API database scenarios
        run: node scripts/verify-db-hevy-full-api.mjs
        env:
          DEPLOY_TEST_DB_URL: postgresql://postgres:postgres@localhost:5432/postgres

      # Migration 155's one item (155 itself loses, moves and queues nothing;
      # the item save, a repeat's day, "Convert old items" and its own Undo —
      # never the original slots, not even through Developer → Activity —,
      # the calendar outbox's upsert and the Google Calendar read-back).
      - name: One item database scenarios
        run: node scripts/verify-db-one-item.mjs
        env:
          DEPLOY_TEST_DB_URL: postgresql://postgres:postgres@localhost:5432/postgres

      # Migration 156: every repeating item's day is a task on its day (one
      # per day even when the job runs twice, only today's on the first run,
      # skipped / deleted / moved days never made again, a training day is the
      # row 142 makes, missed days closed on their day and a late Hevy workout
      # still completing one, each Google choice to the right outbox; the SQL
      # repeat rule compared with daily/recurrence.ts over two years).
      - name: Repeat days as tasks database scenarios
        run: node scripts/verify-db-repeat-days.mjs
        env:
          DEPLOY_TEST_DB_URL: postgresql://postgres:postgres@localhost:5432/postgres

      # Migration 160: supplement schedules and reminders (the table rules,
      # Take as the one write of a taken dose, the doses' states, reminders —
      # once, until taken, a snooze, the window —, the 15-minute job calling
      # push-send only when one is due, the phone's log_supplement match, a
      # delete with Undo; the SQL dose rules compared with supplementDoses.ts
      # day by day and every 5 minutes over two days).
      - name: Supplement schedules database scenarios
        run: node scripts/verify-db-supplement-schedules.mjs
        env:
          DEPLOY_TEST_DB_URL: postgresql://postgres:postgres@localhost:5432/postgres

      # Migrations 157 and 158: a recipe's portion name and its batch (the
      # guards, a start on the server's clock through start_recipe_batch, no
      # macro or diary row touched, 106's triggers still working)
      # and a dish's name on every row (a row joining a dish takes it, one
      # leaving drops it, a rename, a move, an ungroup and its Undo, a copy,
      # another account's rows never mixed in).
      - name: Recipe batches and dish names database scenarios
        run: node scripts/verify-db-food-dishes.mjs
        env:
          DEPLOY_TEST_DB_URL: postgresql://postgres:postgres@localhost:5432/postgres

      # Migration 162: projects for every kind of project (the old items moved
      # into tasks with nothing lost or put on Daily, the status line's and a
      # phase's times, a task's project and phase, blocks and entries,
      # app_create_project, a project's delete with Undo, the owner lock).
      - name: Project blocks database scenarios
        run: node scripts/verify-db-project-blocks.mjs
        env:
          DEPLOY_TEST_DB_URL: postgresql://postgres:postgres@localhost:5432/postgres

      # Migrations 163, 165 and 168: football (follows, a match into the day
      # through app_football_plan with app_save_item, never twice, a deleted
      # item never added again, a moved kick-off, delete with Undo, the owner
      # lock; the Football slot category and 165's one-line change to the item
      # save; favourite teams — a team only, several, kept by a re-run).
      - name: Football database scenarios
        run: node scripts/verify-db-football.mjs
        env:
          DEPLOY_TEST_DB_URL: postgresql://postgres:postgres@localhost:5432/postgres

      # Migration 164: a sleep night confirmed complete (one row per night,
      # undone by a delete, audited, row level security, the owner lock).
      - name: Sleep night confirmation database scenarios
        run: node scripts/verify-db-sleep-confirmations.mjs
        env:
          DEPLOY_TEST_DB_URL: postgresql://postgres:postgres@localhost:5432/postgres

      # Migration 170: the day's diary (one row per day, the owner's own,
      # audited, row level security and the owner lock).
      - name: Diary database scenarios
        run: node scripts/verify-db-diary.mjs
        env:
          DEPLOY_TEST_DB_URL: postgresql://postgres:postgres@localhost:5432/postgres

      # Migration 171: iCloud credentials — a token table only the service
      # role reads and writes (no browser access), with the owner lock.
      - name: iCloud credentials database scenarios
        run: node scripts/verify-db-icloud.mjs
        env:
          DEPLOY_TEST_DB_URL: postgresql://postgres:postgres@localhost:5432/postgres

      # Migration 172: calendar settings (the owner's own row, audited, owner
      # lock) and the iCloud row's area calendars + derived password_sealed.
      - name: Calendar settings database scenarios
        run: node scripts/verify-db-calendar-prefs.mjs
        env:
          DEPLOY_TEST_DB_URL: postgresql://postgres:postgres@localhost:5432/postgres

      # Migrations 166 and 167: a moved training session is moved (its Hevy
      # workout link checked against the new day, a missed day moved is to
      # do, a repeat's day moved without its slot gets one, the one-off
      # repair); a workout completes only its own routine's session and a
      # session lives one week (skipped then done, a move of 7+ days, the
      # week's end skips it).
      - name: Training move recheck database scenarios
        run: node scripts/verify-db-training-recheck.mjs
        env:
          DEPLOY_TEST_DB_URL: postgresql://postgres:postgres@localhost:5432/postgres

      # Migration 169: the 28.10.2026 audit's fixes — a training move read
      # back from Google Calendar or pulled from Google Tasks queues the
      # database's own writes for Google (a plain move still sends nothing
      # back), a repeat moved 7+ days into a week with no session gets one,
      # the app's call a day ahead never closes today, a session 'waiting'
      # is still to do, and a supplement schedule put back keeps its stock
      # clock.
      - name: Training and stock clock fixes database scenarios
        run: node scripts/verify-db-training-stock-fixes.mjs
        env:
          DEPLOY_TEST_DB_URL: postgresql://postgres:postgres@localhost:5432/postgres

      # `npm run lint` is deliberately NOT a gate yet: it is red today, and a
      # large share of the errors come from eslint linting supabase/functions
      # (Deno code checked with browser globals). Narrow the ESLint scope and
      # clear the real src/ findings first, then promote it to a step here.

  # Every scripts/verify-*.cjs|mjs, several at a time, as its own job beside
  # the build above, so it adds no waiting time unless it is slower than the
  # build (measured 21–24 s against ~80 s). The step summary lists each
  # script's result and time.
  all-verify:
    name: All verify scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          # verify-api-registry compares dates with the git history.
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run every verify script
        run: node scripts/run-all-verify.mjs

