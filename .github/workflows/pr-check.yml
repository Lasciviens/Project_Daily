# PR gate. deploy.yml only runs on push to main, so without this a broken build
# is first discovered AFTER merge, by the deploy going red.
#
# Deliberately a separate workflow: adding a pull_request trigger to deploy.yml
# would try to publish a Pages deployment per PR.
name: PR check

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Unlike the Pages deploy, cancelling a type-check has no side effects, so a new
# push to the same branch supersedes the previous run.
concurrency:
  group: pr-check-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  typecheck-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # A throwaway Postgres for the deploy runner's end-to-end checks below
    # (transactions, lock retries, what the public log shows).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Same command the deploy job runs: tsc -b && vite build.
      # No VITE_* secrets on purpose — Vite never executes app code at build
      # time, so a missing env var cannot fail this. This job proves the code
      # COMPILES and BUNDLES; the deploy job is what needs real values.
      - name: Type-check and build
        run: npm run build

      # Pure-function regression suite for the Training -> Progress exercise
      # progress engine (src/features/training/progress-engine/) — this repo
      # has no unit-test runner by convention (see CLAUDE.md), so these run
      # directly via sucrase against the real, un-mocked modules. Previously
      # only ever run locally by hand; a broken engine change could merge
      # with a green PR-check. Add further scripts/verify-*.cjs suites here
      # as they're written.
      - name: Progress engine regression suite
        run: node scripts/verify-progress-engine.cjs

      - name: Progress decisions regression suite
        run: node scripts/verify-progress-decisions.cjs

      # deploy.yml runs every migration numbered above 140 on merge. A new file
      # numbered 140 or lower, or two new files with one number, would never
      # run or would collide — caught here, before the merge.
      - name: Migration names and deploy rules
        run: |
          node scripts/deploy/run-migrations.mjs --check
          node scripts/verify-deploy-migrations.mjs
        env:
          DEPLOY_TEST_DB_URL: postgresql://postgres:postgres@localhost:5432/postgres

      # Migration 142's triggers (training task ⇄ block, skip ⇄ cancel, weekly
      # days) on a throwaway database: migrations 141 + 142 and their scenarios.
      - name: Training session database scenarios
        run: node scripts/verify-db-training-session.mjs
        env:
          DEPLOY_TEST_DB_URL: postgresql://postgres:postgres@localhost:5432/postgres

      # `npm run lint` is deliberately NOT a gate yet: it is red today, and a
      # large share of the errors come from eslint linting supabase/functions
      # (Deno code checked with browser globals). Narrow the ESLint scope and
      # clear the real src/ findings first, then promote it to a step here.

  # Every scripts/verify-*.cjs|mjs, several at a time, as its own job beside
  # the build above, so it adds no waiting time unless it is slower than the
  # build (measured 21–24 s against ~80 s). The step summary lists each
  # script's result and time.
  all-verify:
    name: All verify scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          # verify-api-registry compares dates with the git history.
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run every verify script
        run: node scripts/run-all-verify.mjs

