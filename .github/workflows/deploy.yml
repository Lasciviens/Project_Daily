name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  db-migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Apply database migrations
        run: |
          supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} --password ${{ secrets.SUPABASE_DB_PASSWORD }}
          supabase db push --linked --yes
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

  deploy-edge-functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy Edge Functions
        # news-proxy is a public RSS proxy with its own domain allowlist — no JWT needed
        # All other functions keep default JWT verification
        run: |
          supabase functions deploy news-proxy --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} --no-verify-jwt
          supabase functions deploy ai-proxy --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
          supabase functions deploy calendar-oauth --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
          supabase functions deploy calendar-token --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
          supabase functions deploy calendar-disconnect --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
          supabase functions deploy todoist-proxy --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
          supabase functions deploy strava-auth --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
          supabase functions deploy strava-activities --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
          supabase functions deploy strava-disconnect --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
          # no-verify-jwt: Shortcut authenticates via HEALTH_INGEST_SECRET header instead
          supabase functions deploy health-ingest --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL:        ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY:   ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_TMDB_API_KEY:        ${{ secrets.VITE_TMDB_API_KEY }}
          VITE_GOOGLE_CLIENT_ID:    ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_STRAVA_CLIENT_ID:    ${{ secrets.VITE_STRAVA_CLIENT_ID }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
