# Redeploy nudge: 2026-07-03 — forces a fresh commit SHA so GitHub Pages
# creates a brand-new deployment instead of retrying a wedged one on the same SHA.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # false (not true) per GitHub's own Pages template — cancelling the Actions
  # job doesn't necessarily cancel the in-flight Pages-side deployment, which
  # can leave that environment in a stuck state for the *next* run and is a
  # plausible contributor to "Deployment failed, try again later" errors.
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      # coalesce: whichever deploy attempt succeeded provides the url
      url: ${{ steps.deploy1.outputs.page_url || steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL:        ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY:   ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_TMDB_API_KEY:        ${{ secrets.VITE_TMDB_API_KEY }}
          VITE_GOOGLE_CLIENT_ID:    ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_STRAVA_CLIENT_ID:    ${{ secrets.VITE_STRAVA_CLIENT_ID }}
          VITE_OXR_APP_ID:          ${{ secrets.VITE_OXR_APP_ID }}
          VITE_RP5_SUPABASE_URL:    ${{ secrets.VITE_RP5_SUPABASE_URL }}
          VITE_RP5_SUPABASE_ANON_KEY: ${{ secrets.VITE_RP5_SUPABASE_ANON_KEY }}
          VITE_VAPID_PUBLIC_KEY:    ${{ secrets.VITE_VAPID_PUBLIC_KEY }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      # GitHub Pages' deploy step is intermittently flaky ("Deployment failed,
      # try again later."). Try once; if it fails, wait and retry. Attempt 1 is
      # non-fatal (continue-on-error); the retry is the gate — if it also fails,
      # the job fails for real.
      - name: Deploy to GitHub Pages (attempt 1)
        id: deploy1
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Wait before retry
        if: steps.deploy1.outcome == 'failure'
        run: sleep 20

      - name: Deploy to GitHub Pages (retry)
        id: deployment
        if: steps.deploy1.outcome == 'failure'
        uses: actions/deploy-pages@v4
